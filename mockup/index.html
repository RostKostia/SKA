<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kerdos</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Shown instead of the app when the API runs with KERDOS_AUTH=accounts and nobody is signed in. -->
<div class="auth-screen" id="auth" hidden></div>
<div class="app" id="app" data-view="chat">
  <nav class="nav" aria-label="Main">
    <div class="brand"><span class="mark" aria-hidden="true">κ</span><span class="wordmark">Kerdos</span></div>
    <ul>
      <li><button type="button" data-view="chat">Chat</button></li>
      <li><button type="button" data-view="invoices">Invoices</button></li>
      <li><button type="button" data-view="debtors">Debtors</button></li>
      <li><button type="button" data-view="forecast">Forecast</button></li>
      <li><button type="button" data-view="reminders">Reminders</button></li>
    </ul>
    <p class="nav-note" id="nav-note">Runs on the Kerdos API. Jinius, payments and financing are simulated.</p>
  </nav>

  <header class="topbar">
    <div class="who"><span id="biz">Kerdos</span><span class="badge" id="badge" hidden>Demo data</span></div>
    <div class="top-actions">
      <span id="today"></span>
      <span id="user-name" hidden></span>
      <button type="button" class="btn" id="btn-sign-out" hidden>Sign out</button>
      <button type="button" class="btn" id="btn-skip-time" hidden>Skip time: +3 days</button>
      <button type="button" class="btn" id="btn-reset" hidden>Reset demo</button>
      <button type="button" class="btn" id="btn-client-view">Client view</button>
    </div>
  </header>

  <main class="main" id="main">
    <div id="notice" class="notice" role="status" hidden></div>
    <section id="view-chat" aria-label="Chat">
      <h1 class="sr">Chat with Kerdos</h1>
      <div id="chat-log" role="region" aria-label="Conversation with Kerdos" tabindex="0"></div>
      <div id="announce" class="sr" aria-live="polite"></div>
      <form id="chat-form" autocomplete="off">
        <label for="chat-input" class="sr">Message Kerdos</label>
        <input id="chat-input" type="text" placeholder="Invoice Kostas, 3 hours at €40">
        <button type="submit" class="btn primary">Send</button>
      </form>
    </section>
    <section id="view-invoices" aria-label="Invoices" hidden></section>
    <section id="view-debtors" aria-label="Debtors" hidden></section>
    <section id="view-forecast" aria-label="Cash forecast" hidden></section>
    <section id="view-reminders" aria-label="Reminders" hidden></section>
    <section id="view-client" aria-label="Client view" hidden></section>
    <section id="view-error" aria-label="Error" hidden></section>
  </main>

  <aside id="side-panel" class="side" aria-label="Cash outlook and actions"></aside>
</div>
<!-- All data comes from the Kerdos API on the same origin: open http://localhost:8080/mockup/.
     data.js and logic.js are no longer loaded; they stay as the reference for the original rules and their tests. -->
<script src="app.js"></script>
</body>
</html>
