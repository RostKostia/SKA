name: kerdos

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: kerdos
      POSTGRES_USER: kerdos
      POSTGRES_PASSWORD: ${KERDOS_DB_PASSWORD:?create db/.env with KERDOS_DB_PASSWORD (see db/README.md)}
    ports:
      - "127.0.0.1:${KERDOS_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kerdos -d kerdos"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://kerdos:${KERDOS_DB_PASSWORD}@db:5432/kerdos?sslmode=disable"]

  pgadmin:
    image: dpage/pgadmin4:9.9
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${KERDOS_DB_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro

  # The Go API without installing Go: builds and runs backend/ in a Go container.
  api:
    image: golang:1.23
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    working_dir: /repo/backend
    command: ["go", "run", "./cmd/kerdos-api"]
    environment:
      KERDOS_DATABASE_URL: postgres://kerdos:${KERDOS_DB_PASSWORD}@db:5432/kerdos?sslmode=disable
      KERDOS_HTTP_ADDR: ":8080"
      KERDOS_PUBLIC_URL: http://localhost:3000
      KERDOS_SEED_FILE: /repo/db/seed/sample.sql
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ..:/repo
      - gomod:/go/pkg/mod

volumes:
  pgdata:
  gomod:
